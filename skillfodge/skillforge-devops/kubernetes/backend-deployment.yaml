apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillforge-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: skillforge-api-gateway
  template:
    metadata:
      labels:
        app: skillforge-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: skillforge/api-gateway:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: skillforge-config
---
apiVersion: v1
kind: Service
metadata:
  name: skillforge-api-gateway-svc
spec:
  selector:
    app: skillforge-api-gateway
  ports:
    - port: 4000
      targetPort: 4000
  type: ClusterIP

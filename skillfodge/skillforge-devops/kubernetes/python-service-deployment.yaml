apiVersion: apps/v1
kind: Deployment
metadata:
  name: skillforge-python-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: skillforge-python-service
  template:
    metadata:
      labels:
        app: skillforge-python-service
    spec:
      containers:
        - name: python-service
          image: skillforge/python-service:latest
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: skillforge-python-service-svc
spec:
  selector:
    app: skillforge-python-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
